[package]
name = "hq"
version = "2.0.0"
edition = "2021"
description = "Terminal command centre for scheduled jobs on macOS (launchd + ratatui)"
repository = "https://github.com/potateros/cron-hq"
publish = false

[dependencies]
chrono = "0.4.45"
crossterm = "0.28"
libc = "0.2.191"
ratatui = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.5"
toml = { version = "0.8", features = ["preserve_order"] }
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"

# chrono -> iana-time-zone -> CoreFoundation costs ~4.5 MB RSS per process; see the stub's docs.
[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone-stub" }

# Smaller, faster binary. Keep panic = "unwind": the TUI's workers rely on catch_unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
