[package]
name = "hq"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
crossterm = "0.28"
libc = "0.2.191"
ratatui = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
toml = { version = "0.8", features = ["preserve_order"] }
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.27.0"
